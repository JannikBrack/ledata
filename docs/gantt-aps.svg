<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="687" viewBox="0 0 1020 687" role="img" aria-labelledby="title desc">
  <title id="title">Gantt-Diagramm der Arbeitspakete von LEData</title>
  <desc id="desc">Zeitachse vom 15. Juli bis zum 26. November 2026. Die Balken zeigen die Laufzeit der Arbeitspakete; die AP-Nummern stehen einheitlich rechts neben der Zeitachse. Arbeitspakete derselben Phase verlaufen parallel.</desc>
